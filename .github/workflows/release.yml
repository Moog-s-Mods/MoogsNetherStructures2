name: Release

on:
  push:
    tags:
      - '*.*.*-*.*.*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Structures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod project
        uses: actions/checkout@v6
        with:
          path: project

      - name: Checkout validator
        uses: actions/checkout@v6
        with:
          repository: FinnSetchell/moogs-structure-validator
          ref: v1
          path: validator

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r validator/requirements.txt

      - name: Run validator
        run: python validator/validator.py --config project/validator.json --project-root project

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew build buildDatapack
          echo "---- build/libs contents ----"
          ls -la build/libs/
          echo "---- build/datapack contents ----"
          ls -la build/datapack/

      - name: Extract Changelog
        id: changelog
        shell: bash
        run: |
          VERSION=$(grep -E '^(modVersion|version|mod_version)=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## [[]?" ver "($|[^-])" { capture=1; next }
            /^## / && capture { exit }
            capture { print }
          ' CHANGELOG.md)
          printf "body<<DELIMITER\n%s\nDELIMITER\n" "$BODY" >> "$GITHUB_OUTPUT"

      - name: Read alphaBuild flag
        id: alpha
        shell: bash
        run: |
          IS_ALPHA=$(grep -E '^alphaBuild=' gradle.properties | cut -d= -f2 | tr -d ' \r\n' || true)
          echo "is_alpha=${IS_ALPHA:-false}" >> "$GITHUB_OUTPUT"

      - name: Post Discord Banner
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ALPHA_WEBHOOK_URL: ${{ secrets.DISCORD_ALPHA_WEBHOOK_URL }}
          IS_ALPHA: ${{ steps.alpha.outputs.is_alpha }}
        run: |
          if [ "$IS_ALPHA" = "true" ]; then
            WEBHOOK="$DISCORD_ALPHA_WEBHOOK_URL"
          else
            WEBHOOK="$DISCORD_WEBHOOK"
          fi
          if [ -z "$WEBHOOK" ]; then
            echo "Discord webhook not set, skipping."
            exit 0
          fi
          BANNER_URL=$(grep 'discordBannerUrl=' gradle.properties | cut -d'=' -f2)
          ROLE_ID=$(grep 'discordRoleId=' gradle.properties | cut -d'=' -f2)
          AVATAR_URL=$(grep 'discordAvatarUrl=' gradle.properties | cut -d'=' -f2)
          PING=$(grep 'discordPing=' gradle.properties | cut -d'=' -f2)
          # alphaBuild=true forces no ping (alpha test builds never mention subscribers).
          if [ "$IS_ALPHA" = "true" ]; then
            PING=false
          fi
          if [ "$PING" = "true" ]; then
            CONTENT="<@&$ROLE_ID>\n$BANNER_URL"
            ALLOWED="{\"parse\":[],\"roles\":[\"$ROLE_ID\"]}"
          else
            CONTENT="$BANNER_URL"
            ALLOWED="{\"parse\":[]}"
          fi
          curl -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"Moog's Mods\",\"avatar_url\":\"$AVATAR_URL\",\"content\":\"$CONTENT\",\"allowed_mentions\":$ALLOWED}"

      - name: Publish to CurseForge, Modrinth & Discord
        shell: bash
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew publishMods
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ALPHA_WEBHOOK_URL: ${{ secrets.DISCORD_ALPHA_WEBHOOK_URL }}

      - name: Build release title and body
        id: release_meta
        shell: bash
        env:
          IS_ALPHA: ${{ steps.alpha.outputs.is_alpha }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          if [ "$IS_ALPHA" = "true" ]; then
            TITLE="${GITHUB_REF_NAME} (Alpha)"
            BANNER="> 🧪 **Alpha test build.** Feedback welcome at https://github.com/${GITHUB_REPOSITORY}/issues."
            BODY=$(printf "%s\n\n%s" "$BANNER" "$CHANGELOG_BODY")
          else
            TITLE="${GITHUB_REF_NAME}"
            BODY="$CHANGELOG_BODY"
          fi
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          printf "body<<DELIMITER\n%s\nDELIMITER\n" "$BODY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release_meta.outputs.title }}
          body: ${{ steps.release_meta.outputs.body }}
          prerelease: ${{ steps.alpha.outputs.is_alpha == 'true' }}
          files: |
            build/libs/*.jar
            build/datapack/*.zip
          fail_on_unmatched_files: true

      - name: Bump patch version for next release
        # Skip on alpha. The eventual stable release reuses the same modVersion,
        # so we only bump after a real stable ships.
        if: success() && steps.alpha.outputs.is_alpha != 'true'
        shell: bash
        run: |
          MC=$(grep '^minecraftVersion=' gradle.properties | cut -d= -f2)
          BRANCH="${MC}-datapack"
          TODAY=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          OLD=$(grep '^modVersion=' gradle.properties | cut -d= -f2)
          IFS='.' read -r -a P <<< "$OLD"
          NEW="${P[0]}.${P[1]}.$((P[2]+1))"
          sed -i "s|^modVersion=.*$|modVersion=${NEW}|" gradle.properties
          NEW_VERSION="$NEW" RELEASE_DATE="$TODAY" python3 .github/scripts/post_release_bump.py
          git add gradle.properties CHANGELOG.md
          git commit -m "Post-release: bump ${OLD} -> ${NEW} + stub CHANGELOG section"
          git push origin "$BRANCH"
