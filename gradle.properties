# Discord role ping control. When true, the release-banner post mentions the
# release role. When false, the banner posts silently. Overridden to false
# automatically when alphaBuild=true (alpha test builds never ping subscribers
# regardless of this value).
discordPing=true

# Alpha publish mode.
# When true: CurseForge + Modrinth uploads are marked as ALPHA release type,
# the GitHub release is created as a pre-release, the Discord announcement
# is posted to the DISCORD_ALPHA_WEBHOOK_URL env var (e.g. #test-builds) instead
# of the public DISCORD_WEBHOOK, the jar and datapack archive names pick up an
# -alpha suffix, the Discord embed shows download buttons pointing at the
# actual uploaded alpha jar instead of curated /files and /versions links, and
# the post-release patch-version bump is skipped (so the eventual stable
# release can re-use the same modVersion).
alphaBuild=true
